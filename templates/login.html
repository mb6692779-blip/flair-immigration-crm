<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flair International CRM Login</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#07142e,#163d8f);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:420px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    padding:40px;
    border-radius:25px;
    text-align:center;
    color:white;
    box-shadow:0 0 40px rgba(0,0,0,.4);
}

.logo{
    font-size:48px;
    font-weight:bold;
    margin-bottom:10px;
}

h1{
    margin-top:0;
    font-size:28px;
}

p{
    color:#d0d0d0;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:none;
    border-radius:12px;
    box-sizing:border-box;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#2b82ff;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1464d8;
}

.error{
    color:#ff8a8a;
    margin-bottom:15px;
}
</style>

</head>

<body>

<div class="box">

    <div class="logo">FLAIR</div>

    <h1>Flair International CRM</h1>

    <p>Secure Access Portal</p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
