{% extends "base.html" %}{% block content %}<h2>Transfer Shares</h2>
<div class="panel"><h3>Create Share Account</h3><form method="post" class="gridForm">
<input type="hidden" name="mode" value="create"><select name="share_type">{% for s in SHARE_TYPES %}<option>{{ s }}</option>{% endfor %}</select><input name="transfer_date" type="date"><input name="client_name" list="clientList" placeholder="Client Name"><datalist id="clientList">{% for c in clients %}<option value="{{ c.main_investor }}">{{ c.visa_type }}</option>{% endfor %}</datalist><select name="visa">{% for v in VISA_TYPES %}<option>{{ v }}</option>{% endfor %}</select><input name="inv" placeholder="Invoice No"><input name="total_eur" type="number" step="0.01" placeholder="Total Share EUR"><input name="roe_invoice" type="number" step="0.01" placeholder="Invoice ROE"><input name="updated_by" placeholder="Accounts Person Name"><textarea name="remarks" placeholder="Remarks"></textarea><button>Create Share</button></form></div>
<div class="panel"><h3>Add Share Transfer</h3><form method="post" class="gridForm">
<input type="hidden" name="mode" value="update"><select name="share_payment_id">{% for s in shares %}<option value="{{ s.id }}">{{ s.share_type }} | {{ s.client_name }} | Balance EUR {{ "%.2f"|format(s.balance_eur or 0) }}</option>{% endfor %}</select><input name="transfer_date" type="date"><select name="stage">{% for st in PAYMENT_STAGES %}<option>{{ st }}</option>{% endfor %}</select><input name="transfer_eur" type="number" step="0.01" placeholder="Transfer EUR"><input name="roe" type="number" step="0.01" placeholder="ROE"><input name="updated_by" placeholder="Accounts Person Name" required><textarea name="remarks" placeholder="Remarks"></textarea><button>Add Transfer</button></form></div>{% endblock %}
